<!DOCTYPE html>
<html>
<head>
    <title>Password Checker</title>
    <style>
        body {
            font-family: Arial;
            background: #0f172a;
            color: white;
            text-align: center;
            margin-top: 100px;
        }

        .box {
            background: #1e293b;
            padding: 30px;
            border-radius: 15px;
            width: 350px;
            margin: auto;
        }

        input {
            padding: 10px;
            width: 90%;
            border-radius: 5px;
            border: none;
            outline: none;
        }

        .meter {
            height: 10px;
            margin-top: 10px;
            border-radius: 5px;
            background: #334155;
        }

        .meter-fill {
            height: 100%;
            width: 0%;
            border-radius: 5px;
            transition: 0.3s;
        }

        .weak { background: red; width: 33%; }
        .moderate { background: orange; width: 66%; }
        .strong { background: green; width: 100%; }

        ul {
            text-align: left;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="box">
    <h2>Password Strength Checker 🔐</h2>

    <input type="password" id="password" placeholder="Enter password">

    <div class="meter">
        <div id="meter-fill" class="meter-fill"></div>
    </div>

    <h3 id="strength"></h3>

    <ul id="feedback"></ul>
</div>

<script>
const input = document.getElementById("password");

input.addEventListener("input", async () => {
    const password = input.value;

    const res = await fetch("/check", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({password})
    });

    const data = await res.json();

    const meter = document.getElementById("meter-fill");
    const strengthText = document.getElementById("strength");
    const feedbackList = document.getElementById("feedback");

    // Reset
    meter.className = "meter-fill";

    if (data.strength === "Weak") {
        meter.classList.add("weak");
    } else if (data.strength === "Moderate") {
        meter.classList.add("moderate");
    } else {
        meter.classList.add("strong");
    }

    strengthText.innerText = data.strength;

    feedbackList.innerHTML = "";
    data.feedback.forEach(item => {
        const li = document.createElement("li");
        li.textContent = item;
        feedbackList.appendChild(li);
    });
});
</script>

</body>
</html>
